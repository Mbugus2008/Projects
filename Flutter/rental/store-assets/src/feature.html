<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1024px; height: 500px; overflow: hidden; position: relative;
    background:
      radial-gradient(800px 420px at 8% -20%, rgba(37, 99, 235, .30), transparent 60%),
      radial-gradient(700px 420px at 105% 120%, rgba(30, 58, 138, .45), transparent 55%),
      linear-gradient(135deg, #0B1120 0%, #101B32 55%, #12224A 100%);
    font-family: 'Inter', 'Segoe UI', sans-serif;
    color: #fff;
  }
  .copy { position: absolute; left: 64px; top: 0; height: 100%; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 22px; margin-bottom: 22px; }
  .brand img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 18px 44px rgba(2, 6, 23, .55); display: block; }
  .name { font-size: 52px; font-weight: 800; letter-spacing: -1.4px; line-height: 1.04; }
  .name span { color: #93C5FD; }
  .tagline { font-size: 21px; color: #94A3B8; font-weight: 500; letter-spacing: .2px; margin-top: 10px; }
  .chips { display: flex; gap: 10px; margin-top: 26px; }
  .chips span {
    font-size: 14px; font-weight: 600; color: #BFDBFE;
    border: 1px solid rgba(96, 165, 250, .35); background: rgba(37, 99, 235, .16);
    padding: 7px 14px; border-radius: 999px;
  }
  .phone {
    position: absolute; right: 62px; top: 54px; width: 262px; height: 466px;
    border-radius: 34px; overflow: hidden; border: 1.5px solid rgba(148, 163, 184, .35);
    box-shadow: 0 40px 90px rgba(2, 6, 23, .65);
    transform: rotate(-7deg);
    background: #0B1120;
  }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand">
      <img src="../../assets/icon/app_icon.png" alt="" />
      <div>
        <div class="name">Rental<br />Management</div>
      </div>
    </div>
    <div class="tagline">Properties, tenants, leases and M-PESA &mdash; in one app.</div>
    <div class="chips">
      <span>KSh ready</span><span>Invoices</span><span>Maintenance</span><span>Reports</span>
    </div>
  </div>
  <div class="phone"><img src="../../screenshots/03-dashboard.png" alt="" /></div>
</body>
</html>
