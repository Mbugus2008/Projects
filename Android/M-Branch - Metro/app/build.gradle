apply plugin: 'com.android.application'

// --- Release signing ---
// Loaded from D:\DB\key.properties + D:\DB\upload-keystore.jks (the shared
// Trimline keystore layout, alias "trimline"). Debug builds are unaffected;
// if the file is missing, assembleRelease produces an unsigned APK.
def keystoreProps = new Properties()
def keystorePropsFile = file('D:/DB/key.properties')
def hasReleaseSigning = keystorePropsFile.exists()
if (hasReleaseSigning) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    compileSdk 36
    defaultConfig {
        applicationId 'com.trimline.paul.metro'
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 9
        versionName "1.7"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file('D:/DB/' + keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    buildFeatures {

        dataBinding true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    productFlavors {
    }
    namespace 'com.trimline.paul.metro'
}
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'], exclude: ['gson-2.2.4.jar'])
    implementation 'androidx.activity:activity:1.11.0'
    androidTestImplementation('androidx.test.espresso:espresso-core:3.1.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    }
    )
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.facebook.stetho:stetho:1.6.0'
    implementation 'com.squareup.okhttp3:okhttp:5.3.0'

}
